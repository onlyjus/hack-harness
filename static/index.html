  <style>
    body { font-family: 'Public Sans', sans-serif; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    /* Ghost border utility */
    .ghost-border {
      border: 1px solid rgba(196, 198, 209, 0.15);
    }
    .dark .ghost-border {
      border-color: rgba(68, 71, 78, 0.3);
    }

    /* Glassmorphism panel */
    .glass-panel {
      background: rgba(255, 248, 248, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-panel {
      background: rgba(26, 26, 30, 0.85);
    }

    /* Ambient shadow presets */
    .shadow-ambient {
      box-shadow: 0 8px 32px rgba(30, 27, 28, 0.05);
    }
    .shadow-ambient-lg {
      box-shadow: 0 12px 40px rgba(30, 27, 28, 0.06);
    }
    .dark .shadow-ambient {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    .dark .shadow-ambient-lg {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    /* Headline letter-spacing */
    .tracking-headline { letter-spacing: -0.02em; }

    /* Label tracking */
    .tracking-label { letter-spacing: 0.05em; }

    /* Body line-height */
    .leading-body { line-height: 1.6; }

    /* Sidebar active state */
    .nav-active {
      background-color: #e9e0e1;
      border-right: 4px solid #00193c;
      font-weight: 700;
      color: #00193c;
    }
    .dark .nav-active {
      background-color: #3a3a3f;
      border-right-color: #abc7ff;
      color: #abc7ff;
    }
    .nav-active:active { transform: scale(0.98); }

    /* Progress bar gradient */
    .progress-gradient {
      background: linear-gradient(90deg, #00193c, #002d62);
    }
    .dark .progress-gradient {
      background: linear-gradient(90deg, #abc7ff, #1e4a7e);
    }

    /* SSE log stage colors */
    .stage-extract  .stage-tag { background: #d7e2ff; color: #00193c; }
    .stage-metadata .stage-tag { background: #f5eced; color: #3e5e95; }
    .stage-sections .stage-tag { background: #bdf464; color: #344e00; }
    .stage-compare  .stage-tag { background: #ffdad6; color: #93000a; }
    .stage-done     .stage-tag { background: #bdf464; color: #1e1b1c; }
    .stage-error    .stage-tag { background: #ffdad6; color: #ba1a1a; }

    .stage-tag {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 0.5rem;
    }

    /* Skeleton pulse */
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .skeleton {
      animation: skeleton-pulse 1.5s ease-in-out infinite;
      background: #e9e0e1;
      border-radius: 0.5rem;
    }
    .dark .skeleton {
      background: #3a3a3f;
    }

    /* Drop zone */
    .drop-zone { transition: border-color 0.2s, background 0.2s; }
    .drop-zone.dragover { border-color: #00193c; background: rgba(0,25,60,0.03); }
    .drop-zone.has-file { border-color: #466800; background: rgba(70,104,0,0.03); }
    .dark .drop-zone.dragover { border-color: #abc7ff; background: rgba(171,199,255,0.05); }
    .dark .drop-zone.has-file { border-color: #a2d74b; background: rgba(162,215,75,0.05); }

    /* Screen reader only */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* Focus indicators (ghost-border style per design system) */
    :focus-visible {
      outline: 2px solid #00193c;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .dark :focus-visible {
      outline-color: #abc7ff;
    }

    /* Skip to main content link */
    .skip-link {
      position: absolute; left: -9999px; top: 0;
      z-index: 9999; padding: 0.75rem 1.5rem;
      background: #00193c; color: #fff;
      font-weight: 700; font-size: 0.875rem;
      border-radius: 0 0 0.5rem 0;

<script>
// ── Dark Mode ──
function initDarkMode() {
  var saved = localStorage.getItem('darkMode');
  if (saved === 'true' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
  updateDarkModeIcon();
}
function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  var isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  updateDarkModeIcon();
}
function updateDarkModeIcon() {
  var icon = document.getElementById('dark-mode-icon');

function navigate() {
  var hash = window.location.hash || '#/dashboard';
  var container = document.getElementById('app');
  var matched = false;

  // Clean up overlays and observers on navigation
  if (_notesPanel) { _notesPanel.remove(); _notesPanel = null; }
  for (var i = 0; i < _syncObservers.length; i++) { _syncObservers[i].disconnect(); }
  _syncObservers = [];

  // Restore FAB toolbar visibility when navigating away from comparison view
  var fab = document.getElementById('fab-toolbar');
  if (fab) fab.style.display = '';

  for (var i = 0; i < routes.length; i++) {
    var route = routes[i];
    var m = hash.match(route.pattern);
    if (m) {
      AppState.currentRoute = route.name;
      updateActiveNav(route.name);
      route.render(container, m[1], m[2]);
      matched = true;
      // Announce route change to screen readers
      announceRouteChange(route.name);
      break;
    }
  }

  if (!matched) {
    window.location.hash = '#/dashboard';
  }
}

function announceRouteChange(routeName) {
  var names = {
    dashboard: 'Dashboard',
    library: 'Directives Library',
    compare: 'Comparison Tool',
    gaps: 'Gap Analysis',
    history: 'Comparison History',
  };
  var announcer = document.getElementById('sr-announcer');
  if (announcer) announcer.textContent = 'Navigated to ' + (names[routeName] || routeName);
}

function toggleMobileMenu() {
  var sidebar = document.getElementById('sidebar');
  var btn = document.getElementById('mobile-menu-btn');
  if (!sidebar) return;
  var isVisible = sidebar.classList.toggle('!block');
  if (btn) btn.setAttribute('aria-expanded', isVisible ? 'true' : 'false');
}

function updateActiveNav(routeName) {
  var links = document.querySelectorAll('#sidebar-nav .nav-link');
  for (var i = 0; i < links.length; i++) {
    var link = links[i];
    if (link.dataset.route === routeName) {
      link.className = 'nav-link nav-active flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200';
    } else {
      link.className = 'nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container transition-all duration-200';
    }
  }
}

window.addEventListener('hashchange', navigate);
window.addEventListener('DOMContentLoaded', navigate);

function loadDashboardData() {
  fetch('/api/dashboard')
    .then(function(res) { return res.ok ? res.json() : null; })
    .then(function(data) {
      if (!data) return;
      _dashboardData = data;

      // Metric cards
      var pendingEl = document.getElementById('dash-pending');
      var gapsEl = document.getElementById('dash-gaps');
      var editsEl = document.getElementById('dash-edits');
      var validatedEl = document.getElementById('dash-validated');
      var trendEl = document.getElementById('dash-trend');
      var syncEl = document.getElementById('dash-sync-label');

      if (pendingEl) pendingEl.textContent = String(data.pending_comparisons).padStart(2, '0');
      if (gapsEl) gapsEl.textContent = String(data.recent_gaps_found).padStart(2, '0');
      if (editsEl) editsEl.textContent = String(data.in_progress_edits).padStart(2, '0');
      if (validatedEl) validatedEl.textContent = String(data.total_validated).padStart(2, '0');
      if (trendEl) {
        var pct = data.review_velocity.change_pct;
        trendEl.textContent = (pct > 0 ? '+' : '') + pct + '%';
      }
      if (syncEl) syncEl.textContent = 'Last sync: just now';

      // Review velocity
      var velDesc = document.getElementById('dash-velocity-desc');
      if (velDesc) {
        var v = data.review_velocity;
        if (v.current_month > 0) {
          velDesc.textContent = v.current_month + ' comparisons completed. Rate changed by ' + v.change_pct + '% this month.';
        } else {
          velDesc.textContent = 'No comparisons completed yet. Start your first review above.';
        }
      }

      // Velocity bars — scale to data
      var barsEl = document.getElementById('dash-velocity-bars');
      if (barsEl && data.total_reports > 0) {
        var count = data.total_reports;
        // Generate 7 pseudo-bars based on total count
        var heights = [30, 50, 40, 65, 35, 80, count > 3 ? 96 : 55];
        var opacities = [0.2, 0.4, 0.2, 0.6, 0.3, 1, 0.5];
        var barsHtml = '';
        for (var b = 0; b < 7; b++) {
          barsHtml += '<div class="w-full rounded-t transition-all duration-700" style="height:' + heights[b] + '%;background:rgba(0,25,60,' + opacities[b] + ')"></div>';
        }
        barsEl.innerHTML = barsHtml;
      }

      // Documents
      renderDashboardDocuments(data.recent_documents);
    })
    .catch(function() {
      var syncEl = document.getElementById('dash-sync-label');
      if (syncEl) syncEl.textContent = 'Last sync: error';
      renderDashboardDocuments([]);
    });
}

    html += '</div>';
    html += '</a>';
  }

  target.innerHTML = html;
}

function _loadLibraryData() {
  var qs = '?source_type=' + _libraryFilter.source_type;
  if (_libraryFilter.status) qs += '&status=' + _libraryFilter.status;
  if (_libraryFilter.sort) qs += '&sort=' + _libraryFilter.sort;

  fetch('/api/directives' + qs)
    .then(function(res) { return res.ok ? res.json() : []; })
    .then(function(data) {
      _libraryDirectives = data || [];
      _renderLibraryGrid(_libraryDirectives);
      _updateLibraryStats(_libraryDirectives);
    })
    .catch(function() {
      _renderLibraryEmpty();
    });
}

function _renderLibraryGrid(directives) {
  var grid = document.getElementById('lib-grid');
  if (!grid) return;

  if (!directives.length) {
    _renderLibraryEmpty();
    return;
  }

  var html = '';
  for (var i = 0; i < directives.length; i++) {
    var d = directives[i];
    var isSelected = AppState.selectedDirectives.indexOf(d.directive_id) !== -1;

    if (i === 0) {
      // Featured card (large, 8-col)
      html += _renderFeaturedCard(d, isSelected);
    } else if (i === 1) {
      // Secondary card (4-col)
      html += _renderSecondaryCard(d, isSelected);
    } else {
      // Standard grid card (4-col)
      html += _renderStandardCard(d, isSelected);
    }
  }

  grid.innerHTML = html;
}

function _renderFeaturedCard(d, isSelected) {
  var typeBadge = d.type === 'doe'

  if (status === 'gap_detected') return '<span class="px-3 py-1 bg-error-container text-on-error-container text-[10px] font-bold uppercase rounded-full tracking-tighter">Gap Detected</span>';
  if (status === 'review_pending') return '<span class="px-3 py-1 bg-surface-container-highest text-on-surface text-[10px] font-bold uppercase rounded-full tracking-tighter">Review Pending</span>';
  return '';
}

function _statusLabel(status) {
  if (status === 'current') return 'Approved';
  if (status === 'gap_detected') return 'Gap Detected';
  if (status === 'review_pending') return 'Pending Review';
  return status;
}

function _statusLabelColor(status) {
  if (status === 'current') return 'text-secondary';
  if (status === 'gap_detected') return 'text-error';
  if (status === 'review_pending') return 'text-outline';
  return 'text-outline';
}

function _updateLibraryStats(directives) {
  var total = directives.length;
  var gaps = 0;
  var current = 0;
  for (var i = 0; i < directives.length; i++) {
    if (directives[i].status === 'gap_detected') gaps++;
    if (directives[i].status === 'current') current++;
  }
  var pct = total > 0 ? Math.round((current / total) * 100) : 0;

  var elTotal = document.getElementById('lib-stat-total');
  var elGaps = document.getElementById('lib-stat-gaps');
  var elBar = document.getElementById('lib-stat-bar');
  var elPct = document.getElementById('lib-stat-pct');
  if (elTotal) elTotal.textContent = total;
  if (elGaps) elGaps.textContent = gaps;
  if (elBar) elBar.style.width = pct + '%';
  if (elPct) elPct.textContent = pct + '% of directives are current';
}

function _initLibraryFilters() {
  // Source type toggle
  var toggle = document.getElementById('lib-source-toggle');
  if (toggle) {
    toggle.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-source]');
      if (!btn) return;
      _libraryFilter.source_type = btn.dataset.source;
      _loadLibraryData();
      // Update toggle styles
      var btns = toggle.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) {
        if (btns[i].dataset.source === _libraryFilter.source_type) {
          btns[i].className = 'flex-1 py-1 text-xs font-bold rounded bg-surface-container-lowest text-primary shadow-sm';
        } else {
          btns[i].className = 'flex-1 py-1 text-xs font-bold rounded hover:bg-surface-container-highest text-outline transition-colors';
        }
      }
    });
  }

  // Status filter
  var statusSel = document.getElementById('lib-status-filter');
  if (statusSel) {
    statusSel.value = _libraryFilter.status;
    statusSel.addEventListener('change', function() {
      _libraryFilter.status = statusSel.value;
      _loadLibraryData();
    });
  }

  // Sort
  var sortSel = document.getElementById('lib-sort');
  if (sortSel) {
    sortSel.value = _libraryFilter.sort;
    sortSel.addEventListener('change', function() {
      _libraryFilter.sort = sortSel.value;
      _loadLibraryData();
    });
  }

  // Compare Selected button
  var compareBtn = document.getElementById('lib-compare-btn');
  if (compareBtn) {
    compareBtn.addEventListener('click', function() {
      if (AppState.selectedDirectives.length >= 2) {
        window.location.hash = '#/compare';
      }
    });
  }

  // Delegate click on select buttons
  var grid = document.getElementById('lib-grid');
  if (grid) {
    grid.addEventListener('click', function(e) {
      var btn = e.target.closest('.lib-select-btn');
      if (!btn) return;
      e.stopPropagation();
      var directiveId = btn.dataset.directiveId;
      if (directiveId) toggleDirectiveSelection(directiveId);
    });
  }
}

function toggleDirectiveSelection(directiveId) {
  var idx = AppState.selectedDirectives.indexOf(directiveId);
  if (idx === -1) {
    AppState.selectedDirectives.push(directiveId);
  } else {
    AppState.selectedDirectives.splice(idx, 1);
  }
  // Re-render grid to reflect selection state
  _renderLibraryGrid(_libraryDirectives);
  // Re-attach grid click handler
  var grid = document.getElementById('lib-grid');
  if (grid) {
    grid.addEventListener('click', function(e) {
      var btn = e.target.closest('.lib-select-btn');
      if (!btn) return;
      e.stopPropagation();
      var directiveId = btn.dataset.directiveId;
      if (directiveId) toggleDirectiveSelection(directiveId);
    });
  }
  // Update button count
  var countEl = document.getElementById('lib-sel-count');
  var compareBtn = document.getElementById('lib-compare-btn');
  if (countEl) countEl.textContent = AppState.selectedDirectives.length;
  if (compareBtn) compareBtn.disabled = AppState.selectedDirectives.length < 2;
}

function loadComparisonData(jobId) {
  var sectionsUrl = '/api/report/' + encodeURIComponent(jobId) + '/sections';
  var gapsUrl = '/api/report/' + encodeURIComponent(jobId) + '/gaps';

  Promise.all([
    fetch(sectionsUrl).then(function(r) { return r.ok ? r.json() : null; }),
    fetch(gapsUrl).then(function(r) { return r.ok ? r.json() : null; }),
  ]).then(function(results) {
    var sections = results[0];
    var gaps = results[1];

    if (!sections || !gaps) {
      // Fall back to simple report view
      fetchAndRenderReportFallback(jobId);
      return;
    }

    renderSectionsPanel(sections);
    renderGapsPanel(gaps);
    // Initialize synchronized scrolling between DOE and NETL panels
    initSyncScroll();
  }).catch(function() {
    fetchAndRenderReportFallback(jobId);
  });
}

function renderSectionsPanel(data) {
  // DOE header
  var doeTitle = document.getElementById('doe-title');
  var doeSubtitle = document.getElementById('doe-subtitle');
  if (doeTitle) doeTitle.textContent = data.doe_directive_id || 'DOE Order';
  if (doeSubtitle) doeSubtitle.textContent = 'Source directive';

  // NETL header
  var netlTitle = document.getElementById('netl-title');
  var netlSubtitle = document.getElementById('netl-subtitle');
  if (netlTitle) netlTitle.textContent = data.netl_directive_id || 'NETL Directive';
  if (netlSubtitle) netlSubtitle.textContent = 'Site implementation';

  // DOE Sections
  var doeList = document.getElementById('doe-sections-list');
  if (doeList) {
    var html = '';
    var doeSections = data.doe_sections || [];
    for (var i = 0; i < doeSections.length; i++) {
      var s = doeSections[i];
      var hasFindings = s.findings && s.findings.length > 0;
      var findingStatus = hasFindings ? s.findings[0].status : '';
      var isError = findingStatus === 'missing_from_netl' || findingStatus === 'misaligned';

      if (isError) {
        html += '<article class="p-5 rounded-xl bg-surface-container-highest border-l-4 border-error/40 relative" data-section-id="' + escapeHtml(s.id) + '">';
        html += '<div class="absolute -left-3 top-5 bg-error text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold">' + s.id + '</div>';
      } else {
        html += '<article class="p-5 rounded-xl bg-surface-container-low/50" data-section-id="' + escapeHtml(s.id) + '">';
      }

      html += '<h3 class="text-xs font-bold uppercase tracking-widest text-primary mb-3">' + escapeHtml(s.id) + '. ' + escapeHtml(s.heading) + '</h3>';
      html += '<p class="text-sm leading-relaxed text-on-surface-variant">' + escapeHtml(s.content) + '</p>';

      if (hasFindings) {
        html += '<p class="text-[10px] text-error/70 mt-2 font-semibold">' + escapeHtml(s.findings[0].detail) + '</p>';
      }

      html += '</article>';
    }
    html += '<div class="h-32"></div>';
    doeList.innerHTML = html;
  }

  // NETL Sections
  var netlList = document.getElementById('netl-sections-list');
  if (netlList) {
    var nhtml = '';
    var netlSections = data.netl_sections || [];
    for (var j = 0; j < netlSections.length; j++) {
      var ns = netlSections[j];
      var nHasFindings = ns.findings && ns.findings.length > 0;
      var nStatus = nHasFindings ? ns.findings[0].status : '';

        nhtml += '<p class="text-sm leading-relaxed text-on-surface-variant">' + escapeHtml(ns.content) + '</p>';

        nhtml += '</article>';
      } else {
        nhtml += '<article class="p-5 rounded-xl bg-surface-container-lowest shadow-sm" data-section-id="' + escapeHtml(ns.id) + '">';
        nhtml += '<h3 class="text-xs font-bold uppercase tracking-widest text-primary mb-3">Section ' + escapeHtml(ns.id) + ': ' + escapeHtml(ns.heading) + '</h3>';
        nhtml += '<p class="text-sm leading-relaxed text-on-surface-variant">' + escapeHtml(ns.content) + '</p>';
        nhtml += '</article>';
      }
    }
    nhtml += '<div class="h-32"></div>';
    netlList.innerHTML = nhtml;
  }
}

// ── Synchronized Scrolling ──
var _syncScrollEnabled = true;
var _syncScrollLock = false;
var _syncObservers = [];

function initSyncScroll() {
  // Disconnect previous observers to prevent leaks on re-navigation
  for (var i = 0; i < _syncObservers.length; i++) {
    _syncObservers[i].disconnect();
  }
  _syncObservers = [];

  var doePanel = document.getElementById('doe-sections-list');
  var netlPanel = document.getElementById('netl-sections-list');
  if (!doePanel || !netlPanel) return;

  _observePanel(doePanel, netlPanel);
  _observePanel(netlPanel, doePanel);
}

function _observePanel(sourcePanel, targetPanel) {
  var articles = sourcePanel.querySelectorAll('article[data-section-id]');
  if (!articles.length) return;

  var observer = new IntersectionObserver(function(entries) {
    if (!_syncScrollEnabled || _syncScrollLock) return;

    var best = null;
    var bestRatio = 0;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].isIntersecting && entries[i].intersectionRatio > bestRatio) {
        best = entries[i];
        bestRatio = entries[i].intersectionRatio;
      }
    }

    if (best) {
      var sectionId = best.target.getAttribute('data-section-id');
      if (sectionId) {
        _syncScrollToSection(targetPanel, sectionId);
      }
    }
  }, {
    root: sourcePanel,
    threshold: 0.5,
  });

  for (var i = 0; i < articles.length; i++) {
    observer.observe(articles[i]);
  }
  _syncObservers.push(observer);
}

function _syncScrollToSection(panel, sectionId) {
  var target = panel.querySelector('article[data-section-id="' + sectionId + '"]');
  if (!target) return;

  // Lock prevents the programmatic scroll from triggering the other panel's observer
  _syncScrollLock = true;
  target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(function() { _syncScrollLock = false; }, 600);
}

function renderGapsPanel(data) {
  // Metrics
  var discEl = document.getElementById('gap-discrepancies');
  var critEl = document.getElementById('gap-critical');
  if (discEl) discEl.textContent = String(data.discrepancies || 0).padStart(2, '0');
  if (critEl) critEl.textContent = String(data.critical_gaps || 0).padStart(2, '0');

  // Alignment score
  var barEl = document.getElementById('alignment-bar');
  var labelEl = document.getElementById('alignment-label');

  if (barEl) barEl.style.width = pct + '%';
  if (labelEl) labelEl.textContent = pct + '% alignment with parent DOE directive.';

  // Issue cards
  var issuesList = document.getElementById('gap-issues-list');
  if (issuesList) {

      var borderColor = issue.type === 'conflict' ? 'border-yellow-500/20' : 'border-error/20';

      html += '<div class="p-4 bg-surface rounded-xl shadow-sm border ' + borderColor + '">';
      html += '<div class="flex justify-between items-start mb-2">';

      html += '<span class="text-[10px] text-outline">Ref: ' + escapeHtml(issue.ref || '') + '</span>';
      html += '</div>';

function requestSuggestion(sectionId) {
  showToast('Generating suggestion for section ' + sectionId + '...', 'info');
}

function requestSuggestionForGap(gapId) {
  var jobId = _getActiveJobId();
  if (!jobId) {
    showToast('No active job found.', 'error');
    return;
  }
  AppState.activeJob = jobId;

  showToast('Generating AI suggestion...', 'info');

  fetch('/api/report/' + encodeURIComponent(jobId) + '/suggest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gap_id: gapId, context: '' }),
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.suggested_text) {
        showSuggestionModal(data.suggested_text, data.rationale);
      } else {
        showToast(data.rationale || 'No suggestion generated.', 'error');
      }
    })
    .catch(function(e) {
      showToast('Error: ' + e.message, 'error');
    });
}

function showSuggestionModal(text, rationale) {
  var overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/30 backdrop-blur-sm';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'AI Suggestion');
  overlay.innerHTML = '\
    <div class="bg-surface rounded-2xl shadow-ambient-lg p-8 max-w-xl w-full mx-4 space-y-4">\
      <div class="flex items-center gap-2">\
        <span class="material-symbols-outlined text-primary">auto_awesome</span>\
        <h3 class="font-bold text-primary text-lg">AI Suggestion</h3>\
      </div>\
      <div class="bg-surface-container-low rounded-xl p-4 text-sm leading-body text-on-surface-variant">' + escapeHtml(text) + '</div>\
      <p class="text-xs text-outline"><strong>Rationale:</strong> ' + escapeHtml(rationale) + '</p>\
      <div class="flex gap-3 justify-end">\
        <button class="px-4 py-2 text-sm font-bold text-outline ghost-border rounded-xl hover:bg-surface-container transition-colors" id="dismiss-suggestion">Dismiss</button>\
        <button class="px-4 py-2 text-sm font-bold bg-primary text-on-primary rounded-xl hover:opacity-90 transition-opacity" id="apply-suggestion">Apply Change</button>\
      </div>\
    </div>';

  document.body.appendChild(overlay);

  overlay.querySelector('#dismiss-suggestion').addEventListener('click', function() { overlay.remove(); });
  overlay.querySelector('#apply-suggestion').addEventListener('click', function() {
    showToast('Suggestion applied (saved to draft).', 'success');
    overlay.remove();
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') overlay.remove(); });
  // Focus the first action button for keyboard users
  var firstBtn = overlay.querySelector('#dismiss-suggestion');
  if (firstBtn) firstBtn.focus();
}

function fetchAndRenderReportFallback(jobId) {
  // Fallback: render the old single-panel report view inside the DOE panel area
  var doeList = document.getElementById('doe-sections-list');
  var netlList = document.getElementById('netl-sections-list');

  fetch('/api/report/' + encodeURIComponent(jobId))

        if (doeList) doeList.innerHTML = '<div class="p-6 bg-error-container rounded-xl text-on-error-container">Report not found or still running.</div>';
        return;

function buildReportHTML(report) {

    '<div class="w-20 h-20 rounded-full border-2 flex items-center justify-center font-black text-xs text-center leading-tight ' + (verdictColors[needsUpdate] || verdictColors.uncertain) + '">' +

    '<div class="flex-1">' +
      '<h3 class="text-lg font-bold text-primary mb-1">Comparison Result' +
        '<span class="text-xs font-normal bg-surface-container-highest px-2 py-1 rounded-xl ml-2 text-outline">Confidence: ' + escapeHtml(confidence) + '</span>' +

      '<p class="text-sm text-on-surface-variant leading-body">' + escapeHtml(report.summary || '') + '</p>' +

        '<span>DOE: <strong class="text-primary">' + escapeHtml(report.doe_directive_id || '') + '</strong></span>' +
        '<span>NETL: <strong class="text-primary">' + escapeHtml(report.netl_directive_id || '') + '</strong></span>' +
      '</div>' +
    '</div>' +
  '</div>';

  // Section-by-section findings
  var sections = report.section_by_section || [];
  if (sections.length) {
    var statusColors = {
      aligned: 'bg-secondary/10 text-secondary',
      misaligned: 'bg-error/10 text-error',
      missing_from_netl: 'bg-error-container text-on-error-container',
      outdated: 'bg-surface-container-highest text-outline',
      netl_only: 'bg-primary-fixed text-primary',
    };
    var borderColors = {
      aligned: '#466800',
      misaligned: '#ba1a1a',
    };
    html += '<div class="bg-surface-container-lowest rounded-xl p-6 ghost-border">' +
      '<h3 class="text-base font-bold text-primary mb-4">Section-by-Section Findings <span class="text-xs font-normal bg-surface-container-highest px-2 py-1 rounded-xl ml-1">' + sections.length + '</span></h3>';
    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      var sc = s.status || 'misaligned';
      html += '<div class="pl-4 py-3 mb-3 rounded-xl bg-surface-container" style="border-left: 3px solid ' + (borderColors[sc] || '#747781') + '">' +
        '<p class="font-semibold text-sm text-primary">' + escapeHtml(s.topic || '') +
          '<span class="ml-2 px-2 py-0.5 text-[10px] font-bold uppercase rounded-xl ' + (statusColors[sc] || '') + '">' + (sc || '').replace(/_/g, ' ') + '</span>' +
        '</p>' +
        '<p class="text-xs text-on-surface-variant mt-1 leading-body">' + escapeHtml(s.detail || '') + '</p>' +
      '</div>';
    }
    html += '</div>';
  }

  // Missing requirements
  var missing = report.missing_requirements || [];
  if (missing.length) {
    html += '<div class="bg-surface-container-lowest rounded-xl p-6 ghost-border">' +
      '<h3 class="text-base font-bold text-primary mb-4">Missing Requirements <span class="text-xs font-normal bg-surface-container-highest px-2 py-1 rounded-xl ml-1">' + missing.length + '</span></h3>';
    for (var j = 0; j < missing.length; j++) {
      var m = missing[j];
      html += '<div class="pl-4 py-3 mb-3 rounded-xl bg-error-container/20" style="border-left: 3px solid #ba1a1a">' +
        '<p class="font-semibold text-sm text-primary">' + escapeHtml(m.doe_requirement || '') + '</p>' +
        '<p class="text-xs text-on-surface-variant mt-1 leading-body">' + escapeHtml(m.detail || '') + '</p>' +
      '</div>';
    }
    html += '</div>';
  }

  // Recommendations
  var recs = report.recommendations || [];
  if (recs.length) {
    var prioColors = { high: '#ba1a1a', medium: '#747781', low: '#466800' };
    html += '<div class="bg-surface-container-lowest rounded-xl p-6 ghost-border">' +
      '<h3 class="text-base font-bold text-primary mb-4">Recommendations <span class="text-xs font-normal bg-surface-container-highest px-2 py-1 rounded-xl ml-1">' + recs.length + '</span></h3>';
    for (var k = 0; k < recs.length; k++) {

      html += '<div class="pl-4 py-3 mb-3 rounded-xl bg-surface-container" style="border-left: 3px solid ' + (prioColors[p] || '#747781') + '">' +

        '</p>' +
        '<p class="text-xs text-on-surface-variant mt-1 leading-body">' + escapeHtml(r.action || '') + '</p>' +
      '</div>';
    }
    html += '</div>';
  }

  html += '<a href="#/compare" class="inline-block px-6 py-2 bg-surface-container-highest text-primary rounded-xl text-sm font-bold hover:bg-surface-container transition-colors ghost-border">New Comparison</a>';
  return html;
}

    var netl = report.netl_directive_id || 'Draft';
    var doe = report.doe_directive_id || '';
    if (breadcrumb) breadcrumb.textContent = 'Draft ' + netl;
    if (titleEl) titleEl.textContent = (draft && draft.title) ? draft.title : netl;
    if (doeRef) doeRef.innerHTML = 'Comparison with <span class="font-bold text-on-surface">' + escapeHtml(doe) + '</span>';
  }

  // Render editor canvas
  renderGapEditorCanvas(draft, gaps);

  // Render gap cards
  renderGapCards(jobId, gaps);

  // Update alignment score
  if (gaps) {
    var pct = gaps.alignment_pct || 0;
    var barEl = document.getElementById('gap-align-bar');
    var pctEl = document.getElementById('gap-align-pct');
    var labelEl = document.getElementById('gap-align-label');
    if (barEl) barEl.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
    var critCount = gaps.critical_gaps || 0;
    if (labelEl) labelEl.textContent = critCount > 0
      ? critCount + ' critical gap' + (critCount > 1 ? 's' : '') + ' remaining for full DOE compliance.'
      : 'All critical gaps addressed.';
  }

  // Update save indicator
  var saveEl = document.getElementById('gap-save-indicator');
  if (saveEl && draft && draft.applied_changes && draft.applied_changes.length > 0) {
    saveEl.textContent = 'Last saved: ' + new Date(draft.updated_at).toLocaleTimeString();
  }
}

function renderGapEditorCanvas(draft, gaps) {
  var canvas = document.getElementById('gap-editor-canvas');
  if (!canvas) return;

  var sections = (draft && draft.sections) ? draft.sections : [];
  if (!sections.length) {
    canvas.innerHTML = '<div class="p-8 text-center text-outline"><span class="material-symbols-outlined text-3xl mb-2 block">description</span><p class="font-bold">No sections available</p><p class="text-sm mt-1">Upload and compare directives to see content here.</p></div>';
    return;
  }

  var html = '';

  // Directive header
  var directiveId = (draft && draft.netl_directive_id) ? draft.netl_directive_id : '';
  var directiveTitle = (draft && draft.title) ? draft.title : directiveId;
  var effectiveDate = (draft && draft.effective_date) ? draft.effective_date : '';

  html += '<div class="mb-10 border-b border-surface-container-high pb-8">';
  html += '<p class="text-[11px] font-bold text-outline uppercase tracking-widest mb-4">' + escapeHtml(directiveId) + '</p>';
  html += '<h1 class="text-3xl font-black text-primary leading-tight mb-2">' + escapeHtml(directiveTitle) + '</h1>';
  if (effectiveDate) html += '<p class="text-outline font-medium italic">Effective Date: ' + escapeHtml(effectiveDate) + '</p>';
  html += '</div>';

  // Sections
  html += '<div class="space-y-8 text-on-surface leading-relaxed text-base">';
  for (var i = 0; i < sections.length; i++) {
    var sec = sections[i];
    var gapStatus = sec.gap_status || 'aligned';
    var sectionStatus = sec.status || 'original';

    // Determine styling based on gap status
    var sectionClass = '';
    var borderClass = '';
    if (gapStatus === 'missing_from_netl' || sectionStatus === 'missing') {
      sectionClass = 'bg-error/5 p-5 rounded-xl';
      borderClass = 'border-l-4 border-error';
    } else if (gapStatus === 'misaligned') {
      sectionClass = 'bg-secondary/5 p-5 rounded-xl';
      borderClass = 'border-l-4 border-secondary';
    } else if (gapStatus === 'outdated') {
      sectionClass = 'bg-primary/5 p-5 rounded-xl';
      borderClass = 'border-l-4 border-on-primary-container';
    } else if (sectionStatus === 'modified') {
      sectionClass = 'bg-secondary/10 p-5 rounded-xl';
      borderClass = 'border-l-4 border-secondary';
    } else {
      sectionClass = '';
      borderClass = '';
    }

    html += '<section class="' + sectionClass + ' ' + borderClass + '" id="editor-section-' + escapeHtml(sec.id) + '">';
    html += '<h3 class="font-bold text-primary text-xl mb-4">' + escapeHtml(sec.id) + '. ' + escapeHtml(sec.heading) + '</h3>';

    if (sectionStatus === 'modified') {
      html += '<div class="flex items-center gap-2 mb-3"><span class="material-symbols-outlined text-secondary text-sm">check_circle</span><span class="text-[10px] font-bold uppercase tracking-widest text-secondary">Modified</span></div>';
    }

    if (gapStatus === 'missing_from_netl' && (!sec.content || sec.content.trim() === '')) {
      html += '<div class="py-4 text-center text-error/60">';
      html += '<span class="material-symbols-outlined text-2xl mb-2 block">add_circle_outline</span>';
      html += '<p class="text-sm font-bold">Missing section — use gap card to generate or apply content</p>';
      html += '</div>';
    } else {
      // Render content with inline highlights for gap details
      var content = sec.content || '';
      if (sec.detail && (gapStatus === 'misaligned' || gapStatus === 'outdated')) {
        html += '<p class="text-base leading-relaxed">' + escapeHtml(content) + '</p>';
        html += '<div class="mt-3 bg-surface-container-highest/50 p-3 rounded-lg">';
        html += '<p class="text-[10px] font-bold text-outline uppercase mb-1">Gap Detail</p>';
        html += '<p class="text-sm italic text-on-surface-variant">' + escapeHtml(sec.detail) + '</p>';
        html += '</div>';
      } else {
        html += '<p class="text-base leading-relaxed">' + escapeHtml(content) + '</p>';
      }
    }

    html += '</section>';
  }
  html += '</div>';

  canvas.innerHTML = html;
}

function renderGapCards(jobId, gapsData) {
  var list = document.getElementById('gap-cards-list');
  if (!list) return;

  var issues = (gapsData && gapsData.issues) ? gapsData.issues : [];

  // Filter out dismissed gaps
  var visible = [];
  for (var i = 0; i < issues.length; i++) {
    if (!_gapEditorState.dismissedGaps[issues[i].id]) {
      visible.push(issues[i]);
    }
  }

  if (!visible.length) {
    list.innerHTML = '<div class="py-12 text-center text-outline"><span class="material-symbols-outlined text-3xl mb-2 block">check_circle</span><p class="font-bold text-secondary">All gaps addressed</p><p class="text-sm mt-1">No remaining issues found.</p></div>';
    return;
  }

  var html = '';
  for (var j = 0; j < visible.length; j++) {
    var issue = visible[j];

    // Determine card type and styling
    var cardBorder, iconName, badgeColor, badgeLabel;
    if (issue.type === 'missing') {
      cardBorder = 'border-l-4 border-error';
      iconName = 'error_outline';
      badgeColor = 'text-error';
      badgeLabel = 'Critical Gap';
    } else if (issue.type === 'conflict') {
      cardBorder = 'border-l-4 border-secondary';
      iconName = 'check_circle';
      badgeColor = 'text-secondary';
      badgeLabel = 'Terminology Update';
    } else if (issue.type === 'outdated') {
      cardBorder = 'border-l-4 border-on-primary-container';
      iconName = 'info';
      badgeColor = 'text-on-primary-container';
      badgeLabel = 'Optimization';
    } else {
      cardBorder = 'border-l-4 border-outline';
      iconName = 'info';
      badgeColor = 'text-outline';
      badgeLabel = issue.type || 'Info';
    }

    html += '<div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm ' + cardBorder + '" id="gap-card-' + escapeHtml(issue.id) + '">';

    // Header
    html += '<div class="flex items-start justify-between mb-4">';
    html += '<div class="flex items-center gap-2">';
    html += '<span class="material-symbols-outlined ' + badgeColor + '">' + iconName + '</span>';
    html += '<span class="text-[10px] font-bold uppercase tracking-widest ' + badgeColor + '">' + escapeHtml(badgeLabel) + '</span>';
    html += '</div>';
    html += '<span class="text-[10px] font-medium text-outline">' + escapeHtml(issue.ref || '') + '</span>';
    html += '</div>';

    // Title & description
    html += '<h4 class="font-bold text-primary mb-2">' + escapeHtml(issue.title) + '</h4>';
    html += '<p class="text-sm text-on-surface-variant mb-4 leading-relaxed">' + escapeHtml(issue.description || '') + '</p>';

    // Suggestion area (initially empty, populated by AI)
    html += '<div class="hidden bg-surface-container-low p-4 rounded-lg mb-4" id="gap-suggestion-' + escapeHtml(issue.id) + '">';
    html += '<p class="text-[10px] font-bold text-outline uppercase mb-2">Suggested Addition:</p>';
    html += '<p class="text-sm italic text-primary" id="gap-suggestion-text-' + escapeHtml(issue.id) + '"></p>';
    html += '</div>';

    // Actions
    html += '<div class="flex gap-2">';
    html += '<button class="flex-1 px-4 py-2 bg-primary text-on-primary text-xs font-bold rounded-lg hover:opacity-90 transition-opacity" onclick="gapSuggestAndApply(\'' + escapeHtml(jobId) + '\', \'' + escapeHtml(issue.id) + '\')">Suggest Edit</button>';
    html += '<button class="px-4 py-2 text-outline text-xs font-bold hover:text-primary transition-colors" onclick="gapDismiss(\'' + escapeHtml(issue.id) + '\')">Dismiss</button>';
    html += '<button class="p-2 text-outline hover:text-primary transition-colors" onclick="gapScrollToSection(\'' + escapeHtml(issue.id) + '\')" title="Scroll to section"><span class="material-symbols-outlined text-sm">my_location</span></button>';
    html += '</div>';

    html += '</div>';
  }
  list.innerHTML = html;
}

function gapSuggestAndApply(jobId, gapId) {
  showToast('Generating AI suggestion...', 'info');

  fetch('/api/report/' + encodeURIComponent(jobId) + '/suggest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gap_id: gapId, context: '' }),
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.suggested_text) {
        // Show suggestion in the card
        var suggEl = document.getElementById('gap-suggestion-' + gapId);
        var textEl = document.getElementById('gap-suggestion-text-' + gapId);
        if (suggEl) suggEl.classList.remove('hidden');
        if (textEl) textEl.textContent = data.suggested_text;

        // Show apply modal
        showGapApplyModal(jobId, gapId, data.suggested_text, data.rationale);
      } else {
        showToast(data.rationale || 'No suggestion generated.', 'error');
      }
    })
    .catch(function(e) {
      showToast('Error generating suggestion: ' + e.message, 'error');
    });
}

function showGapApplyModal(jobId, gapId, suggestedText, rationale) {
  var overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/30 backdrop-blur-sm';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Apply AI Suggestion');
  overlay.innerHTML = '\
    <div class="bg-surface rounded-2xl shadow-ambient-lg p-8 max-w-xl w-full mx-4 space-y-4">\
      <div class="flex items-center gap-2">\
        <span class="material-symbols-outlined text-primary">auto_awesome</span>\
        <h3 class="font-bold text-primary text-lg">AI Suggestion</h3>\
      </div>\
      <div class="bg-surface-container-low rounded-xl p-4 text-sm leading-relaxed text-on-surface-variant">' + escapeHtml(suggestedText) + '</div>\
      <p class="text-xs text-outline"><strong>Rationale:</strong> ' + escapeHtml(rationale || '') + '</p>\
      <div class="flex gap-3 justify-end">\
        <button class="px-4 py-2 text-sm font-bold text-outline ghost-border rounded-xl hover:bg-surface-container transition-colors" id="gap-modal-dismiss">Dismiss</button>\
        <button class="px-4 py-2 text-sm font-bold bg-primary text-on-primary rounded-xl hover:opacity-90 transition-opacity" id="gap-modal-apply">Apply Change</button>\
      </div>\
    </div>';

  document.body.appendChild(overlay);

  overlay.querySelector('#gap-modal-dismiss').addEventListener('click', function() { overlay.remove(); });
  overlay.querySelector('#gap-modal-apply').addEventListener('click', function() {
    overlay.remove();
    gapApplyChange(jobId, gapId, suggestedText);
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') overlay.remove(); });
  var firstBtn = overlay.querySelector('#gap-modal-dismiss');
  if (firstBtn) firstBtn.focus();
}

function gapApplyChange(jobId, gapId, text) {
  // Determine section_id from gap_id
  var sectionId = '';
  if (gapId.startsWith('sbs-')) {
    try { sectionId = String(parseInt(gapId.split('-')[1]) + 1); } catch(e) {}
  }

  fetch('/api/report/' + encodeURIComponent(jobId) + '/apply-suggestion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gap_id: gapId, accepted_text: text, section_id: sectionId }),
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status === 'applied') {
        showToast('Change applied to draft (v' + data.draft_version + ').', 'success');
        // Refresh the draft and re-render
        fetch('/api/report/' + encodeURIComponent(jobId) + '/draft')
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(d) {
            if (d) {
              _gapEditorState.draft = d;
              renderGapEditorCanvas(d, _gapEditorState.gaps);
              // Update save indicator
              var saveEl = document.getElementById('gap-save-indicator');
              if (saveEl) saveEl.textContent = 'Last saved: just now';
            }
          });
      } else {
        showToast('Failed to apply change.', 'error');
      }
    })
    .catch(function(e) {
      showToast('Error applying change: ' + e.message, 'error');
    });
}

function gapDismiss(gapId) {
  _gapEditorState.dismissedGaps[gapId] = true;
  var card = document.getElementById('gap-card-' + gapId);
  if (card) {
    card.style.transition = 'opacity 0.3s, transform 0.3s';
    card.style.opacity = '0';
    card.style.transform = 'translateX(20px)';
    setTimeout(function() {
      card.remove();
      // Check if all gaps dismissed
      var list = document.getElementById('gap-cards-list');
      if (list && !list.querySelector('[id^="gap-card-"]')) {
        list.innerHTML = '<div class="py-12 text-center text-outline"><span class="material-symbols-outlined text-3xl mb-2 block">check_circle</span><p class="font-bold text-secondary">All gaps addressed</p><p class="text-sm mt-1">No remaining issues found.</p></div>';
      }
    }, 300);
  }
  showToast('Gap dismissed.', 'info');
}

function gapScrollToSection(gapId) {
  // Parse section id from gap_id
  var sectionId = '';
  if (gapId.startsWith('sbs-')) {
    try { sectionId = String(parseInt(gapId.split('-')[1]) + 1); } catch(e) { return; }
  } else if (gapId.startsWith('missing-')) {
    // Missing requirements don't have direct section mapping
    showToast('This gap does not map to a specific section.', 'info');
    return;
  }

  var el = document.getElementById('editor-section-' + sectionId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // Flash highlight
    el.style.transition = 'box-shadow 0.3s';
    el.style.boxShadow = '0 0 0 3px rgba(0,25,60,0.3)';
    setTimeout(function() { el.style.boxShadow = ''; }, 1500);
  }
}

function generateEditedDirective(jobId) {
  // Check for missing sections and try to generate them
  var draft = _gapEditorState.draft;
  if (!draft || !draft.sections) {
    showToast('No draft data available.', 'error');
    return;
  }

  var missing = [];
  for (var i = 0; i < draft.sections.length; i++) {
    if (draft.sections[i].gap_status === 'missing_from_netl' && (!draft.sections[i].content || !draft.sections[i].content.trim())) {
      missing.push(draft.sections[i]);
    }
  }

  if (!missing.length) {
    showToast('No missing sections to generate. Use individual gap cards to refine content.', 'info');
    return;
  }

  showToast('Generating ' + missing.length + ' missing section(s)...', 'info');

  // Generate first missing section (sequential to avoid overwhelming the API)
  var sec = missing[0];
  fetch('/api/report/' + encodeURIComponent(jobId) + '/generate-section', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ doe_section_id: sec.heading || sec.id }),
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.generated_content) {
        showGapApplyModal(jobId, 'sbs-' + (parseInt(sec.id) - 1), data.generated_content, data.rationale);
      } else {
        showToast(data.rationale || 'Failed to generate section.', 'error');
      }
    })
    .catch(function(e) {
      showToast('Error: ' + e.message, 'error');
    });
}

}

function _initHistoryFilters() {
  var verdictEl = document.getElementById('hist-filter-verdict');
  var confidenceEl = document.getElementById('hist-filter-confidence');
  var sortEl = document.getElementById('hist-sort');
  var resetBtn = document.getElementById('hist-reset-filters');

  if (verdictEl) verdictEl.addEventListener('change', function() {
    _historyFilter.verdict = this.value;
    _loadHistory();
  });
  if (confidenceEl) confidenceEl.addEventListener('change', function() {
    _historyFilter.confidence = this.value;
    _loadHistory();
  });
  if (sortEl) sortEl.addEventListener('change', function() {
    var val = this.value;
    if (val === 'date') { _historyFilter.sort = 'date'; _historyFilter.order = 'desc'; }
    else if (val === 'date-asc') { _historyFilter.sort = 'date'; _historyFilter.order = 'asc'; }
    else if (val === 'directive') { _historyFilter.sort = 'directive'; _historyFilter.order = 'asc'; }
    else if (val === 'directive-desc') { _historyFilter.sort = 'directive'; _historyFilter.order = 'desc'; }
    _loadHistory();
  });
  if (resetBtn) resetBtn.addEventListener('click', function() {
    _historyFilter = { verdict: '', confidence: '', sort: 'date', order: 'desc' };
    if (verdictEl) verdictEl.value = '';
    if (confidenceEl) confidenceEl.value = '';
    if (sortEl) sortEl.value = 'date';
    _loadHistory();
  });
}

function _loadHistory() {
  var target = document.getElementById('history-list');
  if (!target) return;

  var qs = '?sort=' + _historyFilter.sort + '&order=' + _historyFilter.order;
  if (_historyFilter.verdict) qs += '&verdict=' + _historyFilter.verdict;
  if (_historyFilter.confidence) qs += '&confidence=' + _historyFilter.confidence;

  fetch('/api/reports' + qs)
    .then(function(res) {
      if (!res.ok) return [];
      return res.json();
    })
    .then(function(reports) {
      _renderHistoryStats(reports || []);
      _renderHistoryList(reports || []);
    })
    .catch(function() {
      target.innerHTML = '\
        <div class="p-8 bg-error-container/10 rounded-xl text-center">\
          <span class="material-symbols-outlined text-3xl text-error block mb-2">error</span>\
          <p class="text-sm text-error font-semibold">Failed to load history</p>\
        </div>';
    });
}

function _renderHistoryStats(reports) {
  var statsEl = document.getElementById('hist-stats');
  if (!statsEl) return;

  var total = reports.length;
  var needsUpdate = 0, upToDate = 0, uncertain = 0;
  for (var i = 0; i < reports.length; i++) {
    if (reports[i].needs_update === 'yes') needsUpdate++;
    else if (reports[i].needs_update === 'no') upToDate++;
    else uncertain++;
  }

  statsEl.innerHTML = '\
    <div class="p-4 bg-surface-container-lowest rounded-xl ghost-border text-center">\
      <span class="text-3xl font-black text-primary">' + total + '</span>\
      <p class="text-[10px] font-bold uppercase tracking-widest text-outline mt-1">Total Reports</p>\
    </div>\
    <div class="p-4 bg-surface-container-lowest rounded-xl ghost-border text-center">\
      <span class="text-3xl font-black text-error">' + needsUpdate + '</span>\
      <p class="text-[10px] font-bold uppercase tracking-widest text-outline mt-1">Needs Update</p>\
    </div>\
    <div class="p-4 bg-surface-container-lowest rounded-xl ghost-border text-center">\
      <span class="text-3xl font-black text-secondary">' + upToDate + '</span>\
      <p class="text-[10px] font-bold uppercase tracking-widest text-outline mt-1">Up to Date</p>\
    </div>\
    <div class="p-4 bg-surface-container-lowest rounded-xl ghost-border text-center">\
      <span class="text-3xl font-black text-outline">' + uncertain + '</span>\
      <p class="text-[10px] font-bold uppercase tracking-widest text-outline mt-1">Uncertain</p>\
    </div>';
}

function _renderHistoryList(reports) {
  var target = document.getElementById('history-list');
  if (!target) return;

  if (!reports.length) {
    target.innerHTML = '\
      <div class="p-12 bg-surface-container-lowest rounded-xl text-center text-outline ghost-border">\
        <span class="material-symbols-outlined text-5xl mb-3 block">history</span>\
        <p class="font-bold text-lg text-primary">No comparisons found</p>\
        <p class="text-sm mt-2 leading-body">' +
          (_historyFilter.verdict || _historyFilter.confidence
            ? 'No reports match the current filters. Try adjusting your filters.'
            : 'Your completed comparisons will appear here.') +
        '</p>\
        <a href="#/compare" class="inline-block mt-4 px-6 py-2 bg-primary text-on-primary rounded-xl text-sm font-bold hover:opacity-90 transition-opacity">Start First Comparison</a>\
      </div>';
    return;
  }

  var html = '';
  for (var i = 0; i < reports.length; i++) {
    var r = reports[i];
    var verdictBg = r.needs_update === 'yes' ? 'bg-error/10 text-error border-error/20' :
                    r.needs_update === 'no' ? 'bg-secondary/10 text-secondary border-secondary/20' :
                    'bg-surface-container-highest text-outline border-outline-variant/20';
    var verdictLabel = r.needs_update === 'yes' ? 'Needs Update' :
                       r.needs_update === 'no' ? 'Up to Date' : 'Uncertain';
    var confBg = r.confidence === 'high' ? 'text-secondary' :
                 r.confidence === 'medium' ? 'text-yellow-600' :
                 r.confidence === 'low' ? 'text-error' : 'text-outline';
    var dateStr = '';
    if (r.created_at) {
      try {
        var d = new Date(r.created_at);
        dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
                  ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      } catch(e) { dateStr = r.created_at; }
    }

    html += '\
    <div class="group p-5 bg-surface-container-lowest rounded-xl ghost-border hover:shadow-ambient transition-all">\
      <div class="flex items-start gap-4">\
        <div class="flex flex-col items-center gap-2 min-w-[90px]">\
          <span class="px-3 py-1 text-[10px] font-bold uppercase rounded-xl border ' + verdictBg + '">' + escapeHtml(verdictLabel) + '</span>\
          <span class="text-[10px] font-semibold ' + confBg + ' uppercase">' + escapeHtml(r.confidence || '—') + '</span>\
        </div>\
        <a href="#/compare/' + escapeHtml(r.job_id) + '" class="flex-1 min-w-0 cursor-pointer">\
          <div class="flex items-center gap-2 mb-1">\
            <span class="px-2 py-0.5 text-[9px] font-bold uppercase tracking-widest bg-tertiary/10 text-tertiary rounded-lg">DOE</span>\
            <p class="font-bold text-primary text-sm truncate">' + escapeHtml(r.doe_directive_id || r.job_id) + '</p>\
            <span class="text-outline text-xs">vs</span>\
            <span class="px-2 py-0.5 text-[9px] font-bold uppercase tracking-widest bg-primary/10 text-primary rounded-lg">NETL</span>\
            <p class="font-bold text-primary text-sm truncate">' + escapeHtml(r.netl_directive_id || '—') + '</p>\
          </div>\
          <p class="text-xs text-outline mt-1 line-clamp-2">' + escapeHtml((r.summary || '').substring(0, 180)) + ((r.summary || '').length > 180 ? '...' : '') + '</p>\
        </a>\
        <div class="flex flex-col items-end gap-2 min-w-[140px] shrink-0">\
          <div class="flex items-center gap-2">';

    // Alignment bar
    if (typeof r.alignment_pct === 'number') {
      html += '\
            <div class="w-16 h-1.5 bg-surface-container-highest rounded-full overflow-hidden">\
              <div class="h-full rounded-full transition-all ' + (r.alignment_pct >= 80 ? 'bg-secondary' : r.alignment_pct >= 50 ? 'bg-yellow-500' : 'bg-error') + '" style="width:' + r.alignment_pct + '%"></div>\
            </div>\
            <span class="text-xs font-mono font-bold ' + (r.alignment_pct >= 80 ? 'text-secondary' : r.alignment_pct >= 50 ? 'text-yellow-600' : 'text-error') + '">' + r.alignment_pct + '%</span>';
    }

    html += '\
          </div>\
          <span class="text-[10px] text-outline">' + escapeHtml(dateStr) + '</span>\
          <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">\
            <a href="#/compare/' + escapeHtml(r.job_id) + '" class="p-1.5 rounded-lg hover:bg-primary/10 text-primary transition-colors" title="View Report">\
              <span class="material-symbols-outlined text-base">visibility</span>\
            </a>\
            <a href="#/gaps/' + escapeHtml(r.job_id) + '" class="p-1.5 rounded-lg hover:bg-secondary/10 text-secondary transition-colors" title="Gap Analysis">\
              <span class="material-symbols-outlined text-base">analytics</span>\
            </a>\
            <button onclick="event.stopPropagation(); _deleteReport(\'' + escapeHtml(r.job_id) + '\')" class="p-1.5 rounded-lg hover:bg-error/10 text-error transition-colors" title="Delete Report">\
              <span class="material-symbols-outlined text-base">delete</span>\
            </button>\
          </div>\
        </div>\
      </div>\
    </div>';
  }
  target.innerHTML = html;
}

function _deleteReport(jobId) {
  // Show inline confirmation modal instead of browser confirm()
  var overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-black/30 backdrop-blur-sm';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Confirm deletion');
  overlay.innerHTML = '\
    <div class="bg-surface rounded-2xl shadow-ambient-lg p-8 max-w-md w-full mx-4 space-y-4">\
      <div class="flex items-center gap-2">\
        <span class="material-symbols-outlined text-error" aria-hidden="true">warning</span>\
        <h3 class="font-bold text-primary text-lg">Delete Report?</h3>\
      </div>\
      <p class="text-sm text-on-surface-variant leading-relaxed">This will permanently remove report <strong>' + escapeHtml(jobId.substring(0, 8)) + '...</strong> and all associated files.</p>\
      <div class="flex gap-3 justify-end">\
        <button class="px-4 py-2 text-sm font-bold text-outline ghost-border rounded-xl hover:bg-surface-container transition-colors" id="del-cancel">Cancel</button>\
        <button class="px-4 py-2 text-sm font-bold bg-error text-on-error rounded-xl hover:opacity-90 transition-opacity" id="del-confirm">Delete</button>\
      </div>\
    </div>';

  document.body.appendChild(overlay);

  overlay.querySelector('#del-cancel').addEventListener('click', function() { overlay.remove(); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') overlay.remove(); });
  overlay.querySelector('#del-cancel').focus();

  overlay.querySelector('#del-confirm').addEventListener('click', function() {
    overlay.remove();
    fetch('/api/reports/' + encodeURIComponent(jobId), { method: 'DELETE' })
      .then(function(res) {
        if (!res.ok) throw new Error('Delete failed');
        showToast('Report deleted', 'success');
        _loadHistory();
      })
      .catch(function(e) {
        showToast('Failed to delete report: ' + e.message, 'error');
      });
  });
}

// ── UPLOAD LOGIC ──
function initUploadLogic() {
  var submitBtn = document.getElementById('submit-btn');
  if (!submitBtn) return;

  function setupDropZone(dropId, inputId) {
    var zone = document.getElementById(dropId);
    var input = document.getElementById(inputId);
    if (!zone || !input) return;

    zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
    zone.addEventListener('drop', function(e) {
      e.preventDefault();
      zone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        input.dispatchEvent(new Event('change'));
      }
    });

    input.addEventListener('change', function() {
      if (input.files.length) {
        zone.classList.add('has-file');
        var icon = zone.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = 'check_circle';
        var hint = zone.querySelector('.hint');
        if (hint) {
          hint.className = 'text-sm font-bold text-secondary';
          hint.textContent = input.files[0].name;
        }
      }
      checkReady();
    });
  }

  function checkReady() {
    var doeEl = document.getElementById('doe-file');
    var netlEl = document.getElementById('netl-file');
    var doe = doeEl && doeEl.files.length > 0;
    var netl = netlEl && netlEl.files.length > 0;
    submitBtn.disabled = !(doe && netl);
  }

  setupDropZone('doe-drop', 'doe-file');
  setupDropZone('netl-drop', 'netl-file');

  submitBtn.addEventListener('click', function() {
    var doeEl = document.getElementById('doe-file');
    var netlEl = document.getElementById('netl-file');
    var doeFile = doeEl && doeEl.files[0];
    var netlFile = netlEl && netlEl.files[0];
    if (!doeFile || !netlFile) return;

    document.getElementById('upload-section').classList.add('hidden');
    document.getElementById('progress-section').classList.remove('hidden');

    var form = new FormData();
    form.append('doe_file', doeFile);
    form.append('netl_file', netlFile);

    fetch('/api/upload', { method: 'POST', body: form })
      .then(function(res) {
        if (!res.ok) {
          return res.json().then(function(err) {
            showToast('Upload failed: ' + (err.detail || res.statusText), 'error');
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('progress-section').classList.add('hidden');
          });
        }
        return res.json().then(function(data) {
          AppState.activeJob = data.job_id;
          listenProgress(data.job_id);
        });
      })
      .catch(function(e) {
        showToast('Upload error: ' + e.message, 'error');
        document.getElementById('upload-section').classList.remove('hidden');
        document.getElementById('progress-section').classList.add('hidden');
      });
  });
}

function listenProgress(jobId) {
  var log = document.getElementById('progress-log');
  var fill = document.getElementById('progress-fill');
  var pct = document.getElementById('progress-pct');
  if (!log || !fill || !pct) return;

  var retryCount = 0;
  var maxRetries = 5;

  function connect() {
    var es = new EventSource('/api/status/' + encodeURIComponent(jobId));

    es.addEventListener('progress', function(e) {
      retryCount = 0; // Reset on successful message
      var data = JSON.parse(e.data);
      fill.style.width = data.progress + '%';
      pct.textContent = data.progress + '%';

      var entry = document.createElement('div');
      entry.className = 'stage-' + data.stage;
      entry.innerHTML = '<span class="stage-tag">' + escapeHtml(data.stage) + '</span>' + escapeHtml(data.detail);
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    });

    es.addEventListener('complete', function(e) {
      es.close();
      var data = JSON.parse(e.data);
      if (data.status === 'done') {
        window.location.hash = '#/compare/' + jobId;
      } else {
        pct.textContent = 'Error';
        fill.style.background = '#ba1a1a';
        showToast('Comparison failed: ' + (data.detail || 'Unknown error'), 'error');
      }
    });

    es.onerror = function() {
      es.close();
      retryCount++;
      if (retryCount <= maxRetries) {
        var delay = Math.min(1000 * Math.pow(2, retryCount - 1), 16000);
        pct.textContent = 'Reconnecting (' + retryCount + '/' + maxRetries + ')...';
        setTimeout(connect, delay);
      } else {
        pct.textContent = 'Connection lost';
        showToast('Lost connection to server. Please refresh and try again.', 'error');
      }
    };
  }

  connect();
}

// ── Notes Panel ──
var _notesPanel = null;

function _getActiveJobId() {
  if (AppState.activeJob) return AppState.activeJob;
  var m = window.location.hash.match(/^#\/(?:compare|gaps)\/([a-f0-9]+)$/);
  return m ? m[1] : null;
}

function toggleNotesPanel() {
  if (_notesPanel) {
    _notesPanel.remove();
    _notesPanel = null;
    return;
  }

  var jobId = _getActiveJobId();
  if (!jobId) {
    showToast('Navigate to a comparison report to use notes.', 'info');
    return;
  }

  _notesPanel = document.createElement('div');
  _notesPanel.id = 'notes-panel';
  _notesPanel.className = 'fixed bottom-28 right-8 z-[60] w-80 bg-surface rounded-2xl shadow-ambient-lg ghost-border flex flex-col overflow-hidden';
  _notesPanel.style.maxHeight = '420px';
  _notesPanel.innerHTML = '\
    <div class="px-5 py-4 bg-surface-container-low flex items-center justify-between shrink-0">\
      <div class="flex items-center gap-2">\
        <span class="material-symbols-outlined text-primary text-lg">notes</span>\
        <h3 class="font-bold text-primary text-sm uppercase tracking-widest">Notes</h3>\
      </div>\
      <button onclick="toggleNotesPanel()" class="p-1 text-outline hover:text-primary transition-colors rounded">\
        <span class="material-symbols-outlined text-lg">close</span>\
      </button>\
    </div>\
    <div class="flex-1 overflow-y-auto p-4 space-y-3 hide-scrollbar" id="notes-list">\
      <div class="text-center py-6 text-outline">\
        <span class="material-symbols-outlined text-2xl animate-spin">progress_activity</span>\
      </div>\
    </div>\
    <div class="px-4 py-3 bg-surface-container-low shrink-0">\
      <div class="flex gap-2">\
        <input type="text" id="note-input" placeholder="Add a note..." class="flex-1 px-3 py-2 text-sm bg-surface-container-lowest rounded-lg ghost-border focus:ring-2 focus:ring-primary/20 focus:outline-none" onkeydown="if(event.key===\'Enter\')addNote()">\
        <button onclick="addNote()" class="px-3 py-2 bg-primary text-on-primary rounded-lg text-sm font-bold hover:opacity-90 transition-opacity">\
          <span class="material-symbols-outlined text-base">send</span>\
        </button>\
      </div>\
    </div>';

  document.body.appendChild(_notesPanel);
  loadNotes(jobId);
  var input = document.getElementById('note-input');
  if (input) input.focus();
}

function loadNotes(jobId) {
  var list = document.getElementById('notes-list');
  if (!list) return;

  fetch('/api/report/' + encodeURIComponent(jobId) + '/notes')
    .then(function(r) { return r.ok ? r.json() : []; })
    .then(function(notes) {
      if (!notes.length) {
        list.innerHTML = '<div class="text-center py-6 text-outline"><span class="material-symbols-outlined text-2xl block mb-2">sticky_note_2</span><p class="text-xs">No notes yet</p></div>';
        return;
      }
      var html = '';
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var dateStr = '';
        try { dateStr = new Date(n.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) {}
        html += '<div class="p-3 bg-surface-container-lowest rounded-xl group">';
        html += '<p class="text-sm text-on-surface leading-relaxed">' + escapeHtml(n.text) + '</p>';
        html += '<div class="flex items-center justify-between mt-2">';
        html += '<span class="text-[10px] text-outline">' + escapeHtml(dateStr) + '</span>';
        html += '<button onclick="deleteNote(\'' + escapeHtml(n.id) + '\')" class="opacity-0 group-hover:opacity-100 p-1 text-error hover:bg-error/10 rounded transition-all" title="Delete note">';
        html += '<span class="material-symbols-outlined text-xs">delete</span></button>';
        html += '</div></div>';
      }
      list.innerHTML = html;
      list.scrollTop = list.scrollHeight;
    })
    .catch(function() {
      list.innerHTML = '<div class="text-center py-4 text-error text-xs">Failed to load notes</div>';
    });
}

function addNote() {
  var input = document.getElementById('note-input');
  if (!input || !input.value.trim()) return;
  var jobId = _getActiveJobId();
  if (!jobId) return;

  var text = input.value.trim();
  input.value = '';
  input.disabled = true;

  fetch('/api/report/' + encodeURIComponent(jobId) + '/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text }),
  })
    .then(function(r) {
      input.disabled = false;
      if (!r.ok) throw new Error('Failed');
      loadNotes(jobId);
      input.focus();
    })
    .catch(function() {
      input.disabled = false;
      showToast('Failed to save note.', 'error');
    });
}

function deleteNote(noteId) {
  var jobId = _getActiveJobId();
  if (!jobId) return;

  fetch('/api/report/' + encodeURIComponent(jobId) + '/notes/' + encodeURIComponent(noteId), {
    method: 'DELETE',
  })
    .then(function(r) {
      if (!r.ok) throw new Error('Failed');
      loadNotes(jobId);
    })
    .catch(function() {
      showToast('Failed to delete note.', 'error');
    });
}

// ── PDF Export ──
function exportPdf(jobId) {
  window.open('/api/report/' + encodeURIComponent(jobId) + '/export-pdf', '_blank');
}

function exportCurrentPdf() {
  var jobId = _getActiveJobId();
  if (jobId) {
    exportPdf(jobId);
  } else {
    showToast('Navigate to a comparison report first to export.', 'info');
  }
}

// ── Toast Notifications ──
function showToast(message, type) {
  var colors = {
    error: 'bg-error-container text-on-error-container',
    success: 'bg-secondary-container text-on-secondary-container',
    info: 'bg-surface-container-highest text-on-surface',
  };

  var toast = document.createElement('div');
  toast.className = 'fixed top-4 right-4 z-[100] px-6 py-3 rounded-xl shadow-ambient-lg ' + (colors[type] || colors.info) + ' text-sm font-semibold transition-all duration-300';
  toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
  toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-8px)';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}
